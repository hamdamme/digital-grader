name: Backend checks
on:
  push:
    paths: ['backend/**', 'scripts/**', 'sandbox/**', 'infra/minio/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'scripts/**', 'sandbox/**', 'infra/minio/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Sandbox extraction tests (no student execution)
        run: python3 sandbox/test_extraction.py
      - name: Build pinned local MinIO test image
        run: docker build -t digital-grader-minio:2025-10-15 infra/minio
      - name: Unit and PostgreSQL, MinIO, RabbitMQ integration tests
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml verify

  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build security tools
        run: docker build -f sandbox/Dockerfile.security -t digital-grader-security:local sandbox
      - name: Check trusted scanner fixtures
        run: >-
          docker run --rm --network=none --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=256m
          --tmpfs /code:rw,nosuid,nodev,size=256m,uid=10001,gid=10001
          --entrypoint python3 digital-grader-security:local
          -I /opt/digital-grader/test_security_rules.py
