name: Browser workflow
on:
  push:
    paths: ['frontend/**', 'backend/**', 'scripts/browser-smoke.py', 'infra/minio/**', '.github/workflows/browser.yml']
  pull_request:
    paths: ['frontend/**', 'backend/**', 'scripts/browser-smoke.py', 'infra/minio/**', '.github/workflows/browser.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: docker build -t digital-grader-minio:2025-10-15 infra/minio
      - run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml -DskipTests package
      - name: Verify connected browser workflow
        run: python3 scripts/browser-smoke.py
