name: digital-grader
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:?Run scripts/init-dev-env.py}
      POSTGRES_USER: ${DB_USERNAME:?Run scripts/init-dev-env.py}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/init-dev-env.py}
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USERNAME:?Run scripts/init-dev-env.py}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Run scripts/init-dev-env.py}
    ports:
      - "127.0.0.1:${RABBIT_PORT:-5673}:5672"
      - "127.0.0.1:${RABBIT_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 10s
      retries: 20
  minio:
    build: ./infra/minio
    image: digital-grader-minio:2025-10-15
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Run scripts/init-dev-env.py}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Run scripts/init-dev-env.py}
    ports:
      - "127.0.0.1:${MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
  rabbitdata:
  miniodata:
